[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "ferrumquant"
version = "0.1.0"
description = "Python bindings for ferrumquant, a QuantLib-inspired Rust pricing and risk library."
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial",
]

[tool.maturin]
# Build from the workspace root so path deps resolve; `manifest-path` is this crate.
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]
module-name = "ferrumquant"
strip = true
