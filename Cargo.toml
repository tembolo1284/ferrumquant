[workspace]
resolver = "2"
members = [
    "crates/fq-core",   # time, math, market snapshot
    "crates/fq-rates",  # indices, curves, bonds, futures, swaps, swaptions
    "crates/fq-fx",     # currencies, FX forwards/NDFs, vanilla options, vol surfaces
    "crates/fq-py",     # PyO3 bindings -> python module `ferrumquant`
    # "crates/fq-capi", # flat C ABI for Excel/XLL (added later)
]
# Plain `cargo build`/`cargo test` skip the Python bindings; `--workspace`
# (or `maturin develop` in crates/fq-py) still builds them.
default-members = ["crates/fq-core", "crates/fq-rates", "crates/fq-fx"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/tembolo1284/ferrumquant"
description = "QuantLib-inspired Rust library for pricing and risk across rates, FX, and commodities."

[workspace.dependencies]
fq-core = { path = "crates/fq-core" }
fq-rates = { path = "crates/fq-rates" }
fq-fx = { path = "crates/fq-fx" }
num-traits = "0.2"
thiserror = "2"
approx = "0.5"

[workspace.lints.rust]
unsafe_code = "deny"          # fq-capi will opt out of workspace lints
missing_debug_implementations = "warn"

[workspace.lints.clippy]
float_cmp = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
